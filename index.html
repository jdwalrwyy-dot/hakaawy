<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكاوي</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0d0614, #210d35);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            color: #e5a93b;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #c7a4ff;
        }
        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>مرحباً بك في حكاوي</h1>
    <p>غرف صوتية ومرئية ومحادثات ممتعة</p>
    <button class="btn">دخول الغرف</button>
</body>
</html>
